substitutions:
  name: everfrost-30
  friendly_name: EverFrost 30
  everfrost_mac: "E8:EE:CC:74:94:10"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

external_components:
  - source: github://whoamib2/esphome-anker-everfrost@main
    components:
      - everfrost
    refresh: 5min

esp32_ble_tracker:

bluetooth_proxy:
  active: true

ble_client:
  - mac_address: ${everfrost_mac}
    id: everfrost_ble
    auto_connect: true

climate:
  - platform: everfrost
    id: everfrost_cooler
    name: "Cooler"
    ble_client_id: everfrost_ble
    update_interval: 60s
    raw_packet_logging: true

sensor:
  - platform: everfrost
    everfrost_id: everfrost_cooler
    current_temperature:
      name: "Current Temperature"
    battery:
      name: "Battery"

  - platform: ble_client
    type: rssi
    ble_client_id: everfrost_ble
    name: "BLE RSSI"

binary_sensor:
  - platform: everfrost
    everfrost_id: everfrost_cooler
    connected:
      name: "Connected"

button:
  - platform: everfrost
    everfrost_id: everfrost_cooler
    refresh:
      name: "Refresh Status"
